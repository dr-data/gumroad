# Cloudflare Worker Configuration for Gumroad
# This is a template - it will be customized by the setup script

name = "gumroad-development"
main = "src/worker.js"
compatibility_date = "2025-08-07"
node_compat = true

# KV namespace bindings
[[kv_namespaces]]
binding = "SESSIONS"
id = "gumroad-sessions-development"
preview_id = "gumroad-sessions-development-preview"

[[kv_namespaces]]
binding = "CACHE"
id = "gumroad-cache-development"
preview_id = "gumroad-cache-development-preview"

[[kv_namespaces]]
binding = "FEATURE_FLAGS"
id = "gumroad-feature-flags-development"
preview_id = "gumroad-feature-flags-development-preview"

[[kv_namespaces]]
binding = "ANALYTICS"
id = "gumroad-analytics-development"
preview_id = "gumroad-analytics-development-preview"

# [[kv_namespaces]] 
# binding = "CACHE"
# id = ""
# preview_id = ""

# [[kv_namespaces]]
# binding = "FEATURE_FLAGS"
# id = ""
# preview_id = ""

# [[kv_namespaces]]
# binding = "ANALYTICS"
# id = ""
# preview_id = ""

# Environment variables
[vars]
ENVIRONMENT = "development"

# Environment-specific configurations
[env.development]
name = "gumroad-development"
[env.development.vars]
ENVIRONMENT = "development"
MAIN_APP_URL = "http://localhost:3000"

[env.staging]
name = "gumroad-staging"  
[env.staging.vars]
ENVIRONMENT = "staging"
MAIN_APP_URL = "https://staging.gumroad.com"

[env.production]
name = "gumroad-production"
[env.production.vars]
ENVIRONMENT = "production"
MAIN_APP_URL = "https://gumroad.com"

