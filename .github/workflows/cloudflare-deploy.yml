name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - cloudflare-deployment
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '20.17.0'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Cloudflare Pages
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets for Cloudflare
        run: npm run build:cloudflare

      - name: Validate Cloudflare configuration
        run: |
          echo "Validating Cloudflare deployment files..."
          test -f public/_routes.json && echo "✓ _routes.json exists"
          test -f public/_headers && echo "✓ _headers exists"
          test -f public/_redirects && echo "✓ _redirects exists"
          test -f public/index.html && echo "✓ index.html exists"
          test -f wrangler.toml && echo "✓ wrangler.toml exists"
          test -f functions/_worker.js && echo "✓ Worker function exists"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gumroad
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

      - name: Deploy Preview to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        if: github.event_name == 'pull_request'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gumroad
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

      - name: Comment deployment URL on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });
            
            if (deployments.length > 0) {
              const deployment = deployments[0];
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id
              });
              
              const successStatus = statuses.find(status => status.state === 'success');
              
              if (successStatus && successStatus.target_url) {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `🚀 **Cloudflare Pages Deployment**\n\n✅ Preview deployment successful!\n\n🔗 **Preview URL**: ${successStatus.target_url}\n\nThis preview will be updated with every commit to this PR.`
                });
              }
            }

  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint and Test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript/TypeScript
        run: npm run lint-fast

      - name: Validate Cloudflare Workers syntax
        run: |
          npx wrangler validate wrangler.toml
          echo "Cloudflare Workers configuration is valid!"

      - name: Check for security vulnerabilities
        run: npm audit --audit-level high

      - name: Build assets (test)
        run: npm run build:cloudflare