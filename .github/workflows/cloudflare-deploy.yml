name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/cloudflare-deploy.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/cloudflare-deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    name: Deploy to ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: "cloudflare-worker/package-lock.json"

      - name: Install dependencies
        working-directory: ./cloudflare-worker
        run: npm ci

      - name: Deploy to Development
        if: github.event_name == 'pull_request'
        working-directory: ./cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying to development environment..."
          npm run deploy

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ./cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying to production environment..."
          npm run deploy:production

      - name: Test deployment
        if: github.event_name == 'pull_request'
        run: |
          echo "Testing development deployment..."
          # Wait a moment for deployment to propagate
          sleep 10
          # Test the health endpoint
          if [ -n "${{ secrets.CLOUDFLARE_DEVELOPMENT_URL }}" ]; then
            curl -f "${{ secrets.CLOUDFLARE_DEVELOPMENT_URL }}/health" || echo "Health check failed - this is expected for new deployments"
          else
            echo "CLOUDFLARE_DEVELOPMENT_URL secret not set - skipping health check"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = process.env.CLOUDFLARE_DEVELOPMENT_URL || 'https://gumroad-development.your-account.workers.dev';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Cloudflare Worker Deployed
              
              Your Cloudflare Worker has been deployed to the development environment.
              
              **Test endpoints:**
              - Health check: ${deploymentUrl}/health
              - Status: ${deploymentUrl}/api/status  
              - Ping: ${deploymentUrl}/api/ping
              
              The worker will be automatically deployed to production when this PR is merged.`
            });
        env:
          CLOUDFLARE_DEVELOPMENT_URL: ${{ secrets.CLOUDFLARE_DEVELOPMENT_URL }}