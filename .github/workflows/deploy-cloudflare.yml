name: Deploy to Cloudflare

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches: 
      - main

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Test Cloudflare Workers
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cloudflare-workers/package-lock.json
      
      - name: Install dependencies
        working-directory: ./cloudflare-workers
        run: npm ci
      
      - name: Run tests
        working-directory: ./cloudflare-workers
        run: npm test
      
      - name: Run lint
        working-directory: ./cloudflare-workers
        run: npm run lint || echo "Linting not configured"

  deploy-workers:
    name: Deploy Workers to Cloudflare
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cloudflare-workers/package-lock.json
      
      - name: Install dependencies
        working-directory: ./cloudflare-workers
        run: npm ci
      
      - name: Deploy to staging
        working-directory: ./cloudflare-workers
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        working-directory: ./cloudflare-workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pages:
    name: Deploy Pages to Cloudflare
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cloudflare-pages/package-lock.json
      
      - name: Install dependencies
        working-directory: ./cloudflare-pages
        run: npm ci
      
      - name: Build pages
        working-directory: ./cloudflare-pages
        run: npm run build
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gumroad-pages
          directory: cloudflare-pages/dist
          # Optionally, provide additional Wrangler configuration
          wranglerVersion: '3'

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Workers dependencies
        working-directory: ./cloudflare-workers
        run: npm ci
      
      - name: Install Pages dependencies
        working-directory: ./cloudflare-pages
        run: npm ci
      
      - name: Build Pages
        working-directory: ./cloudflare-pages
        run: npm run build
      
      - name: Deploy Preview Workers
        working-directory: ./cloudflare-workers
        run: npx wrangler deploy --env staging --name gumroad-api-pr-${{ github.event.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Deploy Preview Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gumroad-pages
          directory: cloudflare-pages/dist
          wranglerVersion: '3'
          # This creates a preview deployment
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Deployment Ready**
              
              **Workers API**: \`gumroad-api-pr-${{ github.event.number }}.your-account.workers.dev\`
              **Pages Frontend**: Available in the Pages deployment logs above
              
              ⚡ Powered by Cloudflare's global network
              🔧 This is an automated preview of your changes`
            })