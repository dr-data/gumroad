# Cloudflare Pages build configuration
$schema: https://developers.cloudflare.com/pages/configuration/

# Build settings
build:
  command: npm run build
  destination: dist
  root_dir: cloudflare-pages
  
# Environment variables (to be set in Cloudflare dashboard)
env:
  NODE_VERSION: "20"
  NPM_VERSION: "10"
  
# Headers and redirects
headers:
  - source: "/*"
    headers:
      - key: "X-Frame-Options"
        value: "DENY"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - key: "Permissions-Policy"
        value: "camera=(), microphone=(), geolocation=()"

redirects:
  - source: "/api/*"
    destination: "https://your-workers-subdomain.your-account.workers.dev/api/:splat"
    status: 200
  - source: "/checkout/*"
    destination: "https://your-workers-subdomain.your-account.workers.dev/checkout/:splat"
    status: 200